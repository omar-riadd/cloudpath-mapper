[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-path-mapper"
version = "0.1.0"
description = "Maps AWS misconfigurations into chained attack path graphs."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "networkx>=3.2",
    "pyvis>=0.3.2",
]

[project.scripts]
cloud-path-mapper = "cloud_path_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
